# /etc/syslog-ng/conf.d/omr-traffic.conf
# Traffic log with usernames, one JSON object per connection, into
# /var/log/omr-traffic.log:
#   - MQVPN, Glorytun TCP/UDP and OpenVPN flows, Xray and V2Ray connections,
#     from omr-traffic-log ("server": "mqvpn", "glorytun-tcp", ..., "xray")
#   - shadowsocks-go TCP connections, its "Bidirectional copy completed|failed"
#     lines with the text before the JSON removed (a failed one carries "error")
# s_src is Debian's default source (system(), i.e. the journal).

filter f_omr_traffic {
	(program("^omr-traffic-log$") and message("^\\{"))
	or (program("^shadowsocks-go$") and message("Bidirectional copy (completed|failed) \\{"));
};

rewrite r_omr_traffic_json {
	subst("^[^{]*", "", value("MESSAGE") condition(program("^shadowsocks-go$")));
};

destination d_omr_traffic { file("/var/log/omr-traffic.log" perm(0640)); };

log { source(s_src); filter(f_omr_traffic); rewrite(r_omr_traffic_json); destination(d_omr_traffic); };

# To also ship it to a remote collector, add (and list it in the log path):
# destination d_omr_traffic_remote { syslog("collector.example.net" transport("tcp") port(601)); };
