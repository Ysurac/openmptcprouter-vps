# Re-run omr-bypass after every start and reload: "flush ruleset" deletes its
# inet omr_bypass table. --no-block, as omr-bypass is ordered after nftables;
# "-" so a failed hook doesn't fail the firewall load.
[Service]
ExecStartPost=-/bin/systemctl --no-block start omr-bypass.service
ExecReload=-/bin/systemctl --no-block start omr-bypass.service
