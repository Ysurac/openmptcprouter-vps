#!/usr/sbin/nft -f
#
# OpenMPTCProuter VPS -- installed at Debian 13's default nftables path,
# /etc/nftables.conf (confirmed against the stock `nftables` package's own
# conffile and its systemd unit: `nftables.service` runs
# `nft -f /etc/nftables.conf` on boot/reload/reconfigure). Replaces the
# stock empty `table inet filter` skeleton the package ships by default.
#
# Actual ruleset lives in nftables/omr.nft (translated from
# shorewall4/{zones,interfaces,policy,rules,snat}); per-install values
# (WAN interface, tunnel addresses) live in nftables/omr-vars.nft
# (translated from shorewall4/6's params.net + params.vpn). Installed
# alongside this file under /etc/nftables/.
#
# /etc/nftables/omr-vars.nft and /etc/nftables/omr.nft are unconditionally
# overwritten from the shipped copies on every install/update run (see
# debian9-x86_64.sh) -- do not hand-edit them expecting changes to survive.
# /etc/nftables/custom.d/*.nft is the supported place for your own rules:
# the installer only ever `mkdir -p`s that directory, it never writes or
# deletes files inside it, so anything you drop there persists across
# updates. It's glob-included last, after the full OMR ruleset (including
# the live omr-admin-managed chains, custom_dnat_bypass and custom_accept --
# see nftables/omr.nft), so your files can `add rule` into any declared
# chain. nft's glob include is a no-op (not an error) when the directory is
# empty or absent.

flush ruleset

include "/etc/nftables/omr-vars.nft"
include "/etc/nftables/omr.nft"
include "/etc/nftables/custom.d/*.nft"
