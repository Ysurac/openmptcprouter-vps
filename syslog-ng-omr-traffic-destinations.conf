# /etc/syslog-ng/conf.d/omr-traffic-destinations.conf
# Where the traffic log of omr-traffic.conf goes: one driver per line, add or
# remove lines, keep at least one, then: systemctl reload syslog-ng
# The installer creates this file only when it is missing: your edits stay
# across updates.

destination d_omr_traffic {
	file("/var/log/omr-traffic.log" perm(0640));
	# Remote syslog collector:
	# syslog("collector.example.net" transport("tcp") port(601));
};
