# /etc/systemd/system/shadowsocks-go.service.d/omr-traffic-log.conf
# shadowsocks-go logs one line per relayed connection, with the user, at info
# level ("Bidirectional copy completed", "Finished relay serverConn ..."); the
# packaged unit runs it at -logLevel error, which hides them. No color codes in
# the journal: the default "console" preset adds ANSI colors, "systemd" too.
[Service]
ExecStart=
ExecStart=/usr/bin/shadowsocks-go -confPath /etc/shadowsocks-go/server.json -logLevel info -zapConf console-nocolor-notime
