# Drop-in for Debian's stock systemd-networkd-wait-online.service, installed by
# the openmptcprouter-vps installer to
# /etc/systemd/system/systemd-networkd-wait-online.service.d/.
#
# The stock unit waits for EVERY managed link to reach its operational target,
# and on Debian's cloud images it sits in the boot critical chain ahead of
# sysinit.target (cloud-init-network.service is ordered after it), so the whole
# boot waits on it.
#
# --timeout=20 is the part that actually saves an ifupdown-managed VPS. There,
# networking.service owns the interfaces and systemd-networkd is enabled but
# manages nothing, so no link ever reaches "routable" and even --any waits out
# wait-online's own built-in default of 120 seconds, on every single boot.
# Measured on a Hetzner VPS in the issue below:
#   Startup finished in 2.280s (kernel) + 2min 5.439s (userspace)
#   2min 161ms systemd-networkd-wait-online.service
# -- essentially the entire boot. 20s still leaves room for a slow DHCP lease on
# a genuinely networkd-managed link, where the wait returns in a second or two.
#
# --any -o routable covers the other half: return as soon as ONE link is
# actually routable rather than waiting for all of them. Not an invention --
# DigitalOcean's Debian image already ships the same override through netplan at
# /run/systemd/system/systemd-networkd-wait-online.service.d/10-netplan.conf,
# which is why a DO VPS boots in seconds where other providers stall. -o
# routable is not optional: wait-online's default operational state is
# "degraded", which a link satisfies with only a link-local address, so --any
# alone would let network-online.target fire before there is any usable route.
#
# No -i interface list on purpose: the link name is not known at install time,
# and hardcoding one would make the wait unsatisfiable on a renamed interface.
#
# The empty ExecStart= is required -- drop-ins append to ExecStart, so the stock
# invocation has to be cleared before the replacement is given. The 20- prefix
# sorts after a provider's own 10-*.conf, so this override is the one that wins.
#
# https://github.com/Ysurac/openmptcprouter/issues/4367
[Service]
ExecStart=
ExecStart=/lib/systemd/systemd-networkd-wait-online --any -o routable --timeout=20
