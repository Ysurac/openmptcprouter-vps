[INCLUDES]
before = common.conf

[Definition]
_daemon = omr-admin

# omr-admin (the OpenMPTCProuter VPS admin API, omradmin.py) does not log
# failed logins itself with the client address. These lines instead come
# from uvicorn's default access log for the two authentication endpoints:
#   - POST /token         (JWT login used by the router) -> 400 on bad creds
#   - GET  /login_basic    (HTTP Basic login for /docs)    -> 401 on bad/missing creds
failregex = %(__prefix_line)s(?:INFO:?\s+)?<HOST>:[0-9]{1,5} - "POST /token HTTP/1\.[01]" 400\b
            %(__prefix_line)s(?:INFO:?\s+)?<HOST>:[0-9]{1,5} - "GET /login_basic HTTP/1\.[01]" 401\b

ignoreregex =

maxlines = 1
