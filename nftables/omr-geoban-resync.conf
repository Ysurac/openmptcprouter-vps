# Re-run omr-geoban after every start and reload: "flush ruleset" deletes its
# inet omr_geoban table. --no-block, as omr-geoban is ordered after nftables;
# "-" so a failed hook doesn't fail the firewall load. omr-geoban.service is a
# oneshot without RemainAfterExit, so every start runs it again.
[Service]
ExecStartPost=-/bin/systemctl --no-block start omr-geoban.service
ExecReload=-/bin/systemctl --no-block start omr-geoban.service
