# Drop-in for Debian's stock nftables.service. Shipped identically by the
# omr-vps-admin deb (debian/omr-admin-resync.conf -> /lib/systemd/system/
# nftables.service.d/) and by the openmptcprouter-vps installer
# (nftables/omr-admin-resync.conf -> /etc/systemd/system/nftables.service.d/,
# which shadows the /lib copy when both are present); keep the two in sync.
#
# nftables.service runs `nft -f /etc/nftables.conf` on start *and* on reload,
# and that file begins with `flush ruleset` -- so both empty the omr-admin
# managed chains (user_accept, user_dnat, gre_snat, client2client, dscp_mark,
# ct_helpers), whose only durable copy is omr-admin-config.json. omradmin.py
# replays them from there at startup (_nft_resync_all()), so re-trigger that
# replay by restarting omr-admin after every start/reload of the ruleset.
#
# try-restart: a no-op while omr-admin isn't running (at boot its own start
# job is still queued behind After=nftables.service and it comes up into the
# freshly loaded base ruleset by itself). --no-block: omr-admin is ordered
# after this unit, so a blocking restart from inside ExecStartPost would wait
# on nftables becoming active, which waits on this hook -- a deadlock. The
# leading "-" keeps a failed hook from failing the firewall load.
[Service]
ExecStartPost=-/bin/systemctl --no-block try-restart omr-admin.service
ExecReload=-/bin/systemctl --no-block try-restart omr-admin.service
