[DEFAULT]
backend = systemd
banaction = nftables-multiport
ignoreip = 127.0.0.1/8 ::1

[sshd]
enabled = true
# The installer moves sshd to 65222 (debian9-x86_64.sh, "Change SSH port to
# 65222"); fail2ban's own default here is port = ssh, i.e. 22, so every ban
# blocked a port nothing listens on and left the attacker on 65222. 22 stays
# in the list for a VPS where sshd could not be moved and is still there.
port = 22,65222

[openvpn_tcp]
enabled = true
port = 65301
protocol = tcp
filter = openvpn
maxretry = 10
journalmatch = _SYSTEMD_UNIT=openvpn@tun0.service

[openvpn_udp]
enabled = true
port = 65301
protocol = udp
filter = openvpn
maxretry = 10
journalmatch = _SYSTEMD_UNIT=openvpn@tun1.service

[omradmin]
enabled = false
port = 65500
protocol = tcp
filter = omradmin
maxretry = 10
journalmatch = _SYSTEMD_UNIT=omr-admin.service

[xray]
enabled = true
port = 65248,65249,65250,65251,65252
protocol = tcp
filter = xray
maxretry = 6
journalmatch = _SYSTEMD_UNIT=xray.service

[v2ray]
enabled = true
port = 65228,65229,65230,65231
protocol = tcp
filter = v2ray
maxretry = 6
journalmatch = _SYSTEMD_UNIT=v2ray.service

[shadowsocks_go]
enabled = true
port = 65280
protocol = tcp
filter = shadowsocks-go
maxretry = 6
journalmatch = _SYSTEMD_UNIT=shadowsocks-go.service
