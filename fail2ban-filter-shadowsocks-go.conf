[INCLUDES]
before = common.conf

[Definition]
_daemon = shadowsocks-go

# shadowsocks-go logs through zap, and which encoder it runs with decides
# where the message sits on the journal line:
#
#   systemd/console preset: Failed to complete handshake with client	{"clientAddress": "1.2.3.4:5678", ...}
#   json preset:            {"level":"warn","msg":"Failed to complete handshake with client","clientAddress":"1.2.3.4:5678"}
#
# The previous regex required the message to follow the daemon prefix
# immediately, so under the json preset (and under any console line carrying
# its own timestamp) it matched nothing at all and this jail banned no one,
# which on a VPS is indistinguishable from "no attacks". Matching after the
# prefix rather than right at it covers both. The address is still only taken
# from an unescaped "clientAddress": field: zap escapes every quote inside a
# field value, so text coming from the client (an error string, a header) can
# carry \"clientAddress\" but never the real thing, and cannot get an address
# of its choosing banned.
failregex = ^%(__prefix_line)s.*Failed to complete handshake with client\b.*"clientAddress"\s*:\s*"\[?<HOST>\]?:[0-9]{1,5}"

ignoreregex =

maxlines = 1
